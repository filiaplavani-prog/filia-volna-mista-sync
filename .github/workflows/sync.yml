name: Sync volných míst

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_ONEDRIVE_TYPE: onedrive
      RCLONE_CONFIG_ONEDRIVE_TOKEN: ${{ secrets.ONEDRIVE_TOKEN }}
      RCLONE_CONFIG_ONEDRIVE_DRIVE_ID: EF9387C2FBE85A59
      RCLONE_CONFIG_ONEDRIVE_DRIVE_TYPE: personal
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash
      - name: Download private source workbook
        run: rclone copyto 'onedrive:Dokumenty/103 KURZY AKTUÁLNÍ.xlsx' /tmp/source.xlsx
      - name: Build privacy-safe public data
        run: python3 scripts/build_public.py /tmp/source.xlsx docs/data.json
      - name: Publish changed availability
        run: |
          git config user.name "filia-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/index.html
          if git diff --cached --quiet; then
            echo "No availability changes."
          else
            git commit -m "Update volných míst"
            git push
          fi
